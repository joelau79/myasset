<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>有數</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --ink:#111; --muted:#8a8a8e; --muted2:#c7c7cc;
  --green:#34c759; --lime:#b6e34a; --orange:#ff9f0a; --grey:#c7c7cc; --blue:#0a84ff;
  --line:#e5e5ea; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,"PingFang HK","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + var(--safe-b))}
header{position:sticky;top:0;z-index:20;background:rgba(242,242,247,.92);backdrop-filter:blur(12px);padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
h1{font-size:22px;margin:0;flex:1;letter-spacing:-.3px;font-weight:700}
.ico{width:32px;height:32px;border-radius:50%;background:transparent;display:grid;place-items:center;font-size:16px;cursor:pointer;color:#111}
.ico:active{background:#e0e0e6}
main{padding:2px 16px}
h2{font-size:13px;color:var(--muted);font-weight:500;margin:20px 4px 8px;letter-spacing:.2px}
h2 .cnt{color:var(--muted2);font-weight:400}
.gcard{background:var(--card);border-radius:14px;padding:16px 16px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.gtop{display:flex;align-items:flex-start;gap:12px}
.gbig{flex:1;min-width:0}
.gbig .lb{font-size:12.5px;color:var(--muted)}
.gbig .v{font-size:27px;font-weight:700;letter-spacing:-.6px;margin:1px 0 10px}
.gbig .v2{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:1px 0 0}
.gbig .lb2{font-size:12.5px;color:var(--muted);margin-bottom:1px}
.gicon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;flex:0 0 auto;background:#eaf9e4}
.statrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.statrow .nm{font-size:13.5px;width:60px;flex:0 0 auto}
.statrow .bar{flex:1;height:7px;background:#ececf0;border-radius:4px;overflow:hidden}
.statrow .bar i{display:block;height:100%;border-radius:4px;background:var(--green)}
.statrow .cnt{font-size:13px;color:var(--muted);width:22px;text-align:right;flex:0 0 auto}
.tabs{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 15px;border-radius:999px;background:#fff;font-size:13.5px;color:var(--muted);white-space:nowrap;cursor:pointer;flex:0 0 auto;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tab.on{background:var(--ink);color:#fff;font-weight:600;box-shadow:none}
.rowtools{margin-left:auto;display:flex;gap:4px;flex:0 0 auto;padding-left:8px}
.rowtools .ico{width:28px;height:28px;font-size:13px}
.acard{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.aico{width:44px;height:44px;border-radius:12px;background:#f2f2f7;display:grid;place-items:center;font-size:22px;flex:0 0 auto;position:relative}
.aico::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid #fff}
.abody{flex:1;min-width:0}
.astat{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.astat .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.aname{font-size:15.5px;font-weight:600;margin:1px 0 2px;letter-spacing:-.2px}
.acost{font-size:13px;color:var(--muted)}
.aright{margin-left:auto;text-align:right;flex:0 0 auto;padding-top:2px}
.aright .d{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.pbar{height:5px;background:#ececf0;border-radius:3px;margin-top:8px;position:relative}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.pbar .mark{position:absolute;top:-3px;width:2px;height:11px;background:#111;border-radius:1px}
.left{font-size:11.5px;color:var(--muted);margin-top:5px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .e{font-size:46px;margin-bottom:12px}
.empty .m{font-size:15px;color:#8e8e93}
.empty .h{font-size:12.5px;color:var(--muted);margin-top:6px}
.setrow{display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);min-height:46px}
.setrow:last-child{border-bottom:0}
.setrow .si{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#fff;flex:0 0 auto}
.setrow .l{flex:1;font-size:14.5px;min-width:0}
.setrow .r{font-size:14px;color:var(--muted);white-space:nowrap}
.setrow .r.chev{color:var(--muted2);font-size:15px;margin-left:2px}
.sgroup{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sw{width:44px;height:26px;border-radius:14px;background:#e3e3e8;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}
.sw.on::after{left:20px}
.pill{display:inline-flex;background:#e9e9ee;border-radius:9px;padding:2px;gap:2px}
.pill button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.pill button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.banner{background:linear-gradient(135deg,#b6e34a,#d8f27e);border-radius:16px;padding:15px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:14px 14px}
.banner .bt{font-size:16px;font-weight:700;position:relative}
.banner .bs{font-size:12.5px;margin-top:3px;position:relative;opacity:.85}
.banner .bb{margin-top:10px;display:inline-block;background:#111;color:#fff;font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;position:relative;cursor:pointer}
.chartwrap{position:relative;padding:6px 2px 0}
canvas{width:100%;display:block}
.axis{position:absolute;right:0;top:4px;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;font-size:9.5px;color:var(--muted2);pointer-events:none}
.xaxis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted2);margin-top:4px;padding-left:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:center;padding:7px 8px calc(7px + var(--safe-b))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#111;cursor:pointer;font-family:inherit;padding:2px 0}
nav button .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#111}
nav button.on .ic{background:#dff5c8}
nav button.on{font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.22);display:grid;place-items:center;font-size:26px;color:#111;z-index:25;cursor:pointer;border:0;font-weight:300}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .panel{background:var(--bg);width:100%;border-radius:14px 14px 0 0;max-height:94vh;overflow:auto;padding-bottom:calc(24px + var(--safe-b))}
.sheet .shead{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;background:var(--bg);position:sticky;top:0;z-index:2}
.shead .t{flex:1;text-align:center;font-size:17px;font-weight:600}
.shead .x,.shead .ok{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#e3e3e8;cursor:pointer;border:0;color:#111}
.shead .ok{background:#111;color:#fff}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
textarea{resize:vertical}
.frow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .fi{width:26px;text-align:center;font-size:15px;flex:0 0 auto}
.frow .fl{flex:1;font-size:14.5px}
.frow .fv{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:4px}
.frow input,.frow select{border:0;padding:0;text-align:right;font-size:15px;background:none}
.save{margin:16px 16px 0;width:calc(100% - 32px);padding:14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.delbtn{margin:10px 16px 0;width:calc(100% - 32px);padding:13px;border:0;border-radius:12px;background:#fff;color:#ff3b30;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1 id="ttl">有數</h1>
  <div class="ico" onclick="focusSearch()">🔍</div>
  <div class="ico" onclick="go('wishes')">♡</div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<button class="fab" onclick="openSheet()">＋</button>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="panel">
    <div class="shead">
      <button class="x" onclick="closeSheet()">✕</button>
      <div class="t" id="sheetT">新增資產</div>
      <button class="ok" onclick="saveAsset()">✓</button>
    </div>
    <div id="sheetB"></div>
  </div>
</div>

<script src="assets.js" onerror="window.MYASSET=undefined"></script>
<script>
const DATA = (typeof window.MYASSET !== "undefined") ? window.MYASSET : {

"category": "交通工具",
"tags": [
"電動車"
],
"cost_rule": "per_day",
"target_daily_mode": "by_date",
"target_daily": null,
"target_end_date": "2027-08-29",
"include_in_total": true,
"include_in_daily": true,

"retired": false,
"sold": false,
"notes": "",

},
{
"id": "a5",
"name": "結他",
"price": 2100,
"type": "asset",
"purchase_date": "2026-08-15",
"category": "樂器",
"tags": [],
"cost_rule": "per_day",
"target_daily_mode": "none",
"target_daily": null,
"target_end_date": null,
"include_in_total": true,
"include_in_daily": true,
"pinned": false,
"retired": false,
"sold": false,
"notes": "",
"market_value": 2100,
"icon": "🎸"
}
],
"wishes": [],
"history": []
};
let S = JSON.parse(JSON.stringify(DATA));
let tab = 'home', filter = 'all', editing = null, range = 'all', query = '', statMode = 'amount';

const $=s=>document.querySelector(s);
const dec=S.meta.decimals??2;
const fmt=n=>{let v=Number(n||0);let s=v.toFixed(dec);if(S.meta.thousands_separator){const p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');s=p.join('.');}return s;};
const cur=v=>S.meta.currency_symbol+v;
const days=(iso)=>{if(!iso)return 0;const p=String(iso).split('-').map(Number);const u=Date.UTC(p[0],(p[1]||1)-1,p[2]||1);const t=new Date();const now=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());return Math.max(0,Math.round((now-u)/86400000));};
const dur=a=>days(a&&a.purchase_date);
// 原 App 用「向下取整」顯示每項日均成本
const dailyOf=a=>{const n=dur(a);if(!n)return 0;return Math.floor((a.price??0)/n*100)/100;};

function totals(list){
  const t=list.reduce((s,a)=>s+(a.include_in_total!==false && !a.retired && !a.sold ? (a.market_value??a.price):0),0);
  // 總日均 = 精確值相加後四捨五入（每項顯示則向下取整，同原 App 一致）
  const exact=list.reduce((s,a)=>{
    if(a.include_in_daily===false||a.retired||a.sold) return s;
    const n=dur(a); if(!n) return s;
    return s+(a.price??0)/n;
  },0);
  const d=Math.round(exact*100)/100;
  return {total:t,daily:d};
}

function navRender(){
  const items=[['home','🏠','有數'],['wishes','🫙','心願'],['trends','📈','趨勢'],['settings','⚙️','設置']];
  $('#nav').innerHTML=items.map(([k,ic,lb])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="ic">${ic}</span>${lb}</button>`).join('');
}
function go(t){tab=t;render();window.scrollTo(0,0);}
function focusSearch(){const q=prompt('搜尋資產');if(q!==null){query=q.trim();render();}}

function render(){
  navRender();
  const a=$('#app');
  if(tab==='home')a.innerHTML=homeHTML();
  else if(tab==='wishes')a.innerHTML=wishesHTML();
  else if(tab==='trends')a.innerHTML=trendsHTML();
  else if(tab==='settings')a.innerHTML=settingsHTML();
  if(tab==='trends')drawCharts();
}

function homeHTML(){
  const all=S.assets, t=totals(all);
  const use=all.filter(x=>!x.retired&&!x.sold), ret=all.filter(x=>x.retired), sold=all.filter(x=>x.sold);
  const fl=[['全部','all'],['使用中','use'],['已退役','ret'],['已賣出','sold']];
  let list=all.filter(x=>filter==='all'||(filter==='use'&&!x.retired&&!x.sold)||(filter==='ret'&&x.retired)||(filter==='sold'&&x.sold));
  list=list.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  if(query)list=list.filter(a=>a.name.toLowerCase().includes(query.toLowerCase()));
  const bar=(n,color)=>{const p=all.length?(n/all.length*100):0;return `<div class="statrow"><span class="nm">${color==='var(--green)'?'使用中':color==='var(--orange)'?'已退役':'已賣出'}</span><span class="bar"><i style="width:${p}%;background:${color}"></i></span><span class="cnt">${n}</span></div>`;};
  return `
  <h2>資產總覽 <span class="cnt">${all.length}/${all.length}</span></h2>
  <div class="gcard">
    <div class="gtop">
      <div class="gbig">
        <div class="lb">總資產</div>
        <div class="v">${cur(fmt(t.total))}</div>
        <div class="lb2">日均成本</div>
        <div class="v2">${cur(fmt(t.daily))}</div>
      </div>
      <div class="gicon">💰</div>
    </div>
    <div style="margin-top:12px">
      ${bar(use.length,'var(--green)')}
      ${bar(ret.length,'var(--orange)')}
      ${bar(sold.length,'var(--grey)')}
    </div>
  </div>
  <div class="tabs">${fl.map(([l,k])=>`<div class="tab ${filter===k?'on':''}" onclick="filter='${k}';render()">${l}</div>`).join('')}
    <div class="rowtools"><div class="ico" onclick="sortBy('price')">1↓</div><div class="ico" onclick="toggleFilterSheet()">⧩</div><div class="ico" onclick="toggleSelectMode()">☑</div></div>
  </div>
  ${query?`<div class="gcard" style="padding:10px 14px;display:flex;align-items:center;gap:8px"><span>🔍</span><span style="flex:1;font-size:14px">${query}</span><span style="color:var(--muted);cursor:pointer" onclick="query='';render()">✕</span></div>`:''}
  ${list.length?list.map(itemHTML).join(''):'<div class="empty"><div class="e">📦</div><div class="m">目前空空如也</div><div class="h">點擊 ＋ 新增資產</div></div>'}`;
}

let sortMode='default';
function sortBy(m){sortMode=(sortMode===m?'default':m);render();}
function toggleFilterSheet(){alert('篩選：全部 / 使用中 / 已退役 / 已賣出');}
function toggleSelectMode(){alert('多選模式');}

function itemHTML(a){
  const n=dur(a);
  const dv=dailyOf(a);
  let bar='',left='';
  if(a.target_daily_mode==='by_date'&&a.target_end_date){
    const s=String(a.purchase_date).split('-').map(Number);
    const e=String(a.target_end_date).split('-').map(Number);
    const total=Math.max(1,Math.round((Date.UTC(e[0],e[1]-1,e[2])-Date.UTC(s[0],s[1]-1,s[2]))/86400000));
    const remain=Math.max(0,total-n);
    const pct=Math.min(100,n/total*100);
    bar=`<div class="pbar"><i style="width:${pct}%"></i>${remain>0?`<span class="mark" style="left:${pct}%"></span>`:''}</div>`;
    left=`<div class="left">還剩 ${remain} 天</div>`;
  }
  const st=a.retired?'已退役':(a.sold?'已賣出':'使用中');
  const sc=a.retired?'var(--orange)':(a.sold?'var(--grey)':'var(--green)');
  return `<div class="acard" onclick="openSheet('${a.id}')">
    <div class="aico">${a.icon||'📦'}</div>
    <div class="abody">
      <div class="astat"><span class="dot" style="background:${sc}"></span>${st}</div>
      <div class="aname">${a.name}</div>
      <div class="acost">${cur(fmt(a.price))} | ${n} ${S.meta.duration_unit||'天'}</div>
      ${bar}${left}
    </div>
    <div class="aright"><div class="d">${cur(fmt(dv))}/${S.meta.duration_unit||'天'}</div></div>
  </div>`;
}

function wishesHTML(){
  const w=S.wishes||[];
  const t=w.reduce((s,x)=>s+(x.price||0),0);
  return `<h2>心願</h2>
  <div class="gcard">
    <div class="gtop">
      <div class="gbig">
        <div class="lb">心願總值</div>
        <div class="v">${cur(fmt(t))}</div>
        <div class="lb" style="margin-top:6px">心願數量 : ${w.length}</div>
      </div>
      <div class="gicon">🫙</div>
    </div>
  </div>
  ${w.length?w.map(x=>`<div class="acard"><div class="aico">${x.icon||'🫙'}</div><div class="abody"><div class="aname">${x.name}</div><div class="acost">${cur(fmt(x.price))}</div></div><div class="aright"><div class="d">${cur(fmt(x.price))}</div></div></div>`).join('')
  :'<div class="empty"><div class="e">🫙</div><div class="m">目前空空如也</div><div class="h">點擊 ＋ 新增資產</div></div>'}`;
}

function trendsHTML(){
  const t=totals(S.assets);
  const all=S.assets;

/* ---------- charts ---------- */
function series(){
  const all=S.assets.slice().sort((a,b)=>String(a.purchase_date).localeCompare(String(b.purchase_date)));
  const map={};
  all.forEach(a=>{
    const d=a.purchase_date;
    if(!map[d])map[d]={d,v:0,daily:0,n:0};
    map[d].v+=(a.market_value??a.price);
    map[d].daily+=dailyOf(a);
    map[d].n+=1;
  });
  let pts=Object.values(map).sort((a,b)=>a.d.localeCompare(b.d));
  // cumulative
  let cv=0,cd=0;
  pts=pts.map(p=>{cv+=p.v;cd+=p.daily;return {d:p.d,v:cv,daily:cd,n:p.n};});
  const today=new Date().toISOString().slice(0,10);
  if(!pts.length||pts[pts.length-1].d!==today)pts.push({d:today,v:cv,daily:cd,n:0});
  return pts;
}
function barChart(id,pts,key,axisId,xlId,fmtY){
  const c=document.getElementById(id);if(!c)return;
  const wrap=c.parentElement;
  const w=c.width=Math.max(200,wrap.clientWidth-34), h=c.height;
  const vals=pts.map(p=>p[key]);
  const mx=Math.max(...vals,1);
  const nice=n=>{const s=n>=10000?10000:n>=1000?1000:n>=100?100:10;return Math.ceil(n/s)*s;};
  const top=nice(mx);
  const g=c.getContext('2d');
  g.clearRect(0,0,w,h);
  const padB=18,padT=6;
  const bw=Math.max(10,(w-8)/pts.length*0.55);
  pts.forEach((p,i)=>{
    const cx=4+i*((w-8)/pts.length)+((w-8)/pts.length)/2;
    const bh=(p[key]/top)*(h-padB-padT);
    g.fillStyle='#34c759';
    const x=cx-bw/2, y=h-padB-bh;
    if(bh>0)g.fillRect(x,y,bw,bh);
  });
  g.strokeStyle='#e5e5ea';g.lineWidth=1;
  g.beginPath();g.moveTo(0,h-padB+.5);g.lineTo(w,h-padB+.5);g.stroke();
  const ax=document.getElementById(axisId);
  if(ax){const steps=[top,top*0.75,top*0.5,top*0.25,0];ax.innerHTML=steps.map(v=>`<span>${fmtY(v)}</span>`).join('');}
  const xl=document.getElementById(xlId);
  if(xl)xl.innerHTML=pts.map(p=>`<span>${p.d.slice(5).replace('-','.')==='10.22'?'今天':p.d.slice(5).replace('-','.')}</span>`).join('');
}
function fmtW(v){
  if(v>=100000000)return (v/100000000).toFixed(0)+'w';
  if(v>=10000)return (v/10000).toFixed(0)+'w';
  if(v>=1000)return (v/1000).toFixed(0)+'k';
  return String(Math.round(v));
}
function drawCharts(){
  const pts=series();
  barChart('c1',pts,'v','ax1','xl1',fmtW);
  barChart('c2',pts.filter(p=>p.n>0),'v','ax2','xl2',fmtW);
  barChart('c3',pts,'daily','ax3','xl3',fmtW);
}
